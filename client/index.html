  <body>
    <div id="root">
      <div id="app-boot-shell" role="status" aria-live="polite" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#fffaf0 0%,#ffffff 52%,#fff7ed 100%);font-family:'Noto Sans JP',system-ui,sans-serif;color:#111827;box-sizing:border-box">

          <div id="app-boot-mark" style="width:52px;height:52px;margin:0 auto 18px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#ea580c);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:22px">LCJ</div>
          <div id="app-boot-title" style="font-size:20px;font-weight:800;letter-spacing:.01em">LCJ MALLを読み込んでいます</div>
          <p id="app-boot-message" style="margin:10px 0 0;color:#6b7280;font-size:14px;line-height:1.7">安全な接続を準備しています。しばらくお待ちください。</p>
          <div style="height:4px;margin-top:22px;border-radius:999px;background:#f3f4f6;overflow:hidden"><div style="width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,#f59e0b,#ea580c);animation:app-boot-progress 1.2s ease-in-out infinite alternate"></div></div>
          <a id="app-boot-reload" href="" style="display:none;margin-top:20px;color:#c2410c;font-size:14px;font-weight:700;text-decoration:underline">ページを再読み込みする</a>
        </div>
      </div>
      <style>@keyframes app-boot-progress{from{transform:translateX(-45%)}to{transform:translateX(140%)}}@media(prefers-reduced-motion:reduce){#app-boot-shell *{animation:none!important}}</style>
      <noscript><p style="padding:24px;text-align:center;font-family:sans-serif">このページを利用するにはJavaScriptを有効にしてください。</p></noscript>
    </div>
    <script>
      (function () {
        var festival = location.hostname.indexOf('livecommercefestival') !== -1;
        if (festival) {
          document.title = 'Live Commerce Festival 2026 一般参加お申し込み';
          var mark = document.getElementById('app-boot-mark');
          var title = document.getElementById('app-boot-title');
          var message = document.getElementById('app-boot-message');
          if (mark) mark.textContent = 'LCF';
          if (title) title.textContent = 'Live Commerce Festival 2026';
          if (message) message.textContent = '一般参加お申し込みフォームを読み込んでいます。初めての方もこのままお待ちください。';
        }
        window.setTimeout(function () {
          var shell = document.getElementById('app-boot-shell');
          if (!shell) return;
          var message = document.getElementById('app-boot-message');
          var reload = document.getElementById('app-boot-reload');
          if (message) message.textContent = festival ? '通信に時間がかかっています。読み込みは継続中です。表示されない場合は再読み込みしてください。' : '通信に時間がかかっています。読み込みは継続中です。';
          if (reload) reload.style.display = 'inline-block';
        }, 12000);
      })();
    </script>
